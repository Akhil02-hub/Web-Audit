server {
    listen 80;
    server_name outside.vercel.app;
    root /var/www/outside-in/public;
    index index.html;
    error_page 404 /404.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location = /.well-known/traffic-advice {
        default_type application/trafficadvice+json;
    }

    location = /.well-known/webfinger {
        default_type application/jrd+json;
    }

    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
